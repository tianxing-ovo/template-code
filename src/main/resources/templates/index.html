<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台</title>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <!-- 引入高档英文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 提示框容器 -->
<div id="toast-container"></div>

<!-- 顶部导航 -->
<header>

    <div style="font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 1rem;">
        <!-- 主题切换按钮 -->
        <button id="theme-toggle" class="btn btn-secondary btn-sm" onclick="toggleTheme()"
                style="padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;">
            <!-- 太阳图标 -->
            <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                 stroke="currentColor" style="width:16px; height:16px;">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
            </svg>
            <!-- 月亮图标 -->
            <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                 stroke="currentColor" style="width:16px; height:16px; display:none;">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
            </svg>
        </button>
        <span class="status-badge status-2">在线</span>
        <!-- 用户头像及下拉菜单 -->
        <div class="profile-container">
            <div class="user-avatar" id="user-avatar" onclick="toggleProfileDropdown(arguments[0])">U</div>
            <div class="profile-dropdown" id="profile-dropdown">
                <div class="dropdown-header">
                    <div class="dropdown-user-info">
                        <div class="dropdown-avatar" id="dropdown-avatar">U</div>
                        <div class="dropdown-user-text">
                            <div class="user-name" id="dropdown-user-name">未登录</div>
                            <div class="user-username" id="dropdown-user-username">@Guest</div>
                        </div>
                    </div>
                    <span class="status-badge" id="dropdown-user-role">-</span>
                </div>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item" onclick="showToast('提示', '详情中心建设中...', 'info')">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                         stroke="currentColor" style="width: 14px; height: 14px;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                    </svg>
                    个人中心
                </button>
                <button class="dropdown-item logout-btn" onclick="logout()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                         stroke="currentColor" style="width: 14px; height: 14px;">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
                    </svg>
                    退出登录
                </button>
            </div>
        </div>
    </div>
</header>

<!-- 主布局 -->
<div class="main-scroll-wrapper">
    <main>

        <!-- 左侧栏：用户管理与上传 -->
        <div style="display: flex; flex-direction: column; gap: 2rem;">

            <!-- 用户管理卡片 -->
            <div class="glass-card">
                <div class="card-header">
                    <div class="card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                             stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.109A11.386 11.386 0 0110.089 20c-2.202 0-4.277-.625-6.042-1.71a3.12 3.12 0 014.538-4.908c.556.449 1.161.8 1.815 1.054m4.796-1.48c.024-.31.034-.62.034-.931s-.01-.621-.034-.931m-4.796 1.48a11.112 11.112 0 003.478-.397m-12 5.62c.34-.059.68-.114 1.022-.165m0 0a10.82 10.82 0 019.98-9.98m-9.98 9.98A11.411 11.411 0 0110.09 18a11.41 11.41 0 01-6.042-1.71"/>
                        </svg>
                        用户数据管理
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="openAddModal()">
                        + 新增用户
                    </button>
                </div>

                <!-- 搜索表单 -->
                <div class="form-row form-row-3">
                    <div class="form-group">
                        <label class="form-label" for="search-id">用户 ID</label>
                        <input type="number" id="search-id" class="form-control" placeholder="按ID精准查询">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="search-name">姓名</label>
                        <input type="text" id="search-name" class="form-control" placeholder="按姓名模糊查询">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="search-age">年龄</label>
                        <input type="number" id="search-age" class="form-control" placeholder="输入最大年龄限制">
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-bottom: 1.5rem;">
                    <button class="btn btn-secondary btn-sm" onclick="resetSearch()">重置</button>
                    <button class="btn btn-primary btn-sm" onclick="loadUsers()">搜索</button>
                </div>

                <!-- 用户列表表格 -->
                <div class="table-container">
                    <table id="user-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>姓名</th>
                            <th>年龄</th>
                            <th>性别</th>
                            <th>城市</th>
                            <th>兴趣爱好</th>
                            <th>描述</th>
                            <th>角色</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="user-table-body">
                        <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 文件上传卡片 -->
            <div class="glass-card">
                <div class="card-header">
                    <div class="card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                             stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
                        </svg>
                        文件传输中心
                    </div>
                </div>

                <div class="form-row form-row-2">
                    <div class="form-group">
                        <label class="form-label">单个文件上传</label>
                        <div class="upload-zone" onclick="document.getElementById('single-file').click()">
                            <svg class="upload-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>
                            <div class="upload-text">点击或拖拽文件 <span>上传</span></div>
                            <input type="file" id="single-file" style="display:none"
                                   onchange="uploadSingleFile(this.files[0])">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">批量文件上传</label>
                        <div class="upload-zone" onclick="document.getElementById('batch-files').click()">
                            <svg class="upload-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M9 13h6m-3-3v6m-9 1V4a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                            </svg>
                            <div class="upload-text">点击或拖拽多个文件 <span>批量上传</span></div>
                            <input type="file" id="batch-files" multiple style="display:none"
                                   onchange="uploadBatchFiles(this.files)">
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 数据交换与异步任务 -->
        <div style="display: flex; flex-direction: column; gap: 2rem;">

            <div class="glass-card">
                <div class="card-header">
                    <div class="card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                             stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M7.5 7.5h-.75A2.25 2.25 0 004.5 9.75v7.5a2.25 2.25 0 002.25 2.25h7.5a2.25 2.25 0 002.25-2.25h-.75m-6 3.75l3 3m0 0l3-3m-3 3V1.5m6 9h.75a2.25 2.25 0 012.25 2.25v7.5a2.25 2.25 0 01-2.25 2.25h-7.5a2.25 2.25 0 01-2.25-2.25v-.75"/>
                        </svg>
                        数据导入与导出
                    </div>
                </div>

                <!-- Excel 导入 -->
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label">Excel 导入用户（支持自动存入数据库）</label>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="file" id="excel-import-file" class="form-control" accept=".xlsx,.xls,.csv"
                               style="flex-grow: 1;">
                        <button class="btn btn-primary" onclick="importExcel()">导入</button>
                    </div>
                </div>

                <!-- Excel 导出配置 -->
                <div style="border-top: 1px solid var(--border-subtle); padding-top: 1.5rem;">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="form-label">选择导出字段</label>
                        <div class="field-checkbox-container">
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields" value="id"
                                                                       checked> ID</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields" value="name"
                                                                       checked> 姓名</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields"
                                                                       value="username" checked> 用户名</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields" value="age"
                                                                       checked> 年龄</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields" value="sex"
                                                                       checked> 性别</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields"
                                                                       value="hobbies" checked> 兴趣爱好</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields"
                                                                       value="password" checked> 密码</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields"
                                                                       value="province" checked> 省份</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields" value="city"
                                                                       checked> 城市</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields"
                                                                       value="address" checked> 详细地址</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields"
                                                                       value="description" checked> 描述</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields"
                                                                       value="createTime" checked> 创建时间</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields"
                                                                       value="updateTime" checked> 更新时间</label>
                            <label class="field-checkbox-label"><input type="checkbox" name="export-fields" value="role"
                                                                       checked> 角色</label>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                        <button class="btn btn-secondary" onclick="exportToBrowser()">同步导出</button>
                        <button class="btn btn-secondary" onclick="exportToLocal()">异步导出</button>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header">
                    <div class="card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                             stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M9 12h3.75M9 15h3.375c.9 0 1.625-.724 1.625-1.625 0-.9-.725-1.625-1.625-1.625H9.75M12 21a9.003 9.003 0 008.354-5.646 9.003 9.003 0 00-8.354-5.646M12 21a9.003 9.003 0 01-8.354-5.646 9.003 9.003 0 018.354-5.646M12 21V3m0 18a9 9 0 009-9M12 3a9 9 0 00-9 9m9-9V3m0 0a9 9 0 019 9"/>
                        </svg>
                        后台导出任务监控器
                    </div>
                    <div style="display:flex; align-items:center; gap: 0.25rem;">
                        <input type="checkbox" id="auto-refresh" checked style="cursor:pointer">
                        <label for="auto-refresh"
                               style="font-size:0.75rem; color:var(--text-secondary); cursor:pointer">自动刷新</label>
                    </div>
                </div>

                <div class="table-container">
                    <table id="task-table">
                        <thead>
                        <tr>
                            <th>任务 ID</th>
                            <th>状态</th>
                            <th>文件大小</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="task-table-body">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>
</div>

<!-- 新增用户 -->
<div class="modal" id="add-user-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="modal-title">添加新用户</div>
            <button class="modal-close" onclick="closeAddModal()">&times;</button>
        </div>
        <form id="add-user-form" onsubmit="submitAddUser(arguments[0])">
            <input type="hidden" id="edit-user-id">
            <div class="form-row form-row-3">
                <div class="form-group">
                    <label class="form-label" for="add-name">姓名 *</label>
                    <input type="text" id="add-name" class="form-control" required placeholder="请输入姓名">
                </div>
                <div class="form-group">
                    <label class="form-label" for="add-username">用户名 *</label>
                    <input type="text" id="add-username" class="form-control" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label class="form-label" id="password-label" for="add-password">密码 *</label>
                    <input type="password" id="add-password" class="form-control" required placeholder="请输入密码">
                </div>
            </div>
            <div class="form-row form-row-2">
                <div class="form-group">
                    <label class="form-label" for="add-age">年龄</label>
                    <input type="number" id="add-age" class="form-control" max="150" placeholder="请输入年龄">
                </div>
                <div class="form-group">
                    <label class="form-label" for="add-sex">性别</label>
                    <select id="add-sex" class="form-control">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
            </div>
            <div class="form-row form-row-2">
                <div class="form-group">
                    <label class="form-label" for="add-role">系统角色</label>
                    <select id="add-role" class="form-control">
                        <option value="普通用户">普通用户</option>
                        <option value="管理员">管理员</option>
                    </select>
                </div>
                <div class="form-group"></div>
            </div>
            <div class="form-row form-row-2">
                <div class="form-group">
                    <label class="form-label" for="add-province">省份 *</label>
                    <select id="add-province" class="form-control" required onchange="onProvinceChange()">
                        <option value="">请选择省份</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="add-city">城市</label>
                    <select id="add-city" class="form-control">
                        <option value="">请选择城市</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label class="form-label" for="add-address">详细地址 *</label>
                <input type="text" id="add-address" class="form-control" required placeholder="如：南山区科兴科学园">
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label class="form-label" for="tags-input-field">兴趣爱好</label>
                <div class="tags-input-container" id="hobbies-tags-container">
                    <input type="text" id="tags-input-field" placeholder="输入爱好并按回车或逗号分隔">
                </div>
                <input type="hidden" id="add-hobbies">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="add-description">个人描述</label>
                <textarea id="add-description" class="form-control" rows="2" placeholder="介绍一下你自己..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                <button type="button" class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                <button type="submit" class="btn btn-primary">提交保存</button>
            </div>
        </form>
    </div>
</div>

<div style="display: none;">
    <div class="toast show"></div>
    <span class="status-0 status-1 status-3"></span>
    <div class="modal show"></div>
    <div class="tag-badge">
        <span class="remove-tag"></span>
    </div>
    <div class="profile-dropdown show"></div>
</div>

<!-- JavaScript 交互逻辑 -->
    <script src="/js/app.js"></script>
</body>
</html>
